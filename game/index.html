<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYPOST 〜風紋の配達便〜</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="SKYPOST 風紋の配達便: 夕暮れの島しょ海岸を飛び、発光する風標リングをくぐって断崖沿いの滑走路へ着陸するアーケード飛行ゲーム"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Over plain http the ES-module source works directly:
     <script type="module" src="./src/main.js"></script>
     For file:// (Chrome blocks module imports there) the generated classic bundle is used.
     Regenerate after editing src/ with: node tools/build.mjs -->
<script src="./bundle.js"></script>
<script>
setTimeout(function () {
  if (!window.__SKYPOST_OK) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;padding:12px;background:#3a1020;color:#ffd9d0;font:14px monospace;text-align:center;z-index:9';
    d.textContent = 'bundle.js が見つかりません。game/ ディレクトリで「node tools/build.mjs」を実行してください。';
    document.body.appendChild(d);
  }
}, 400);
</script>
</body>
</html>
